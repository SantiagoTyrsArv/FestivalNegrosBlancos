name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # BD libSQL efímera por ejecución: el CI nunca escribe en la BD de producción en Turso.
  TURSO_DATABASE_URL: file:ci.db
  AUTH_SECRET: ci-secreto-de-autenticacion-de-al-menos-32-caracteres
  REVALIDATION_SECRET: ci-secreto-de-revalidacion
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm db:setup
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
